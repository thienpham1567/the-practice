services:
  - type: web
    name: the-practice-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @writing-helper/api build
    startCommand: pnpm --filter @writing-helper/api exec prisma migrate deploy && node apps/api/dist/main.js
    # ready (SELECT 1) thay vì live: DB chết → Render restart. Chấp nhận vì app
    # không dùng được khi DB down; timeout 2s ở /health/ready tránh nghẽn probe.
    # Rủi ro: DB bảo trì ngắn có thể gây restart loop.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: anthropic/claude-haiku-4.5
      - key: WEB_ORIGIN
        value: https://the-practice.onrender.com
      # Bỏ trống → Sentry tắt. Release lấy từ RENDER_GIT_COMMIT (Render tự đặt).
      - key: SENTRY_DSN
        sync: false
      # Proxy được tin khi tìm IP người dùng — preset "render" trong
      # src/common/proxy-trust.ts (loopback, mạng nội bộ Render, proxy rewrite
      # của static site, Cloudflare). Thiếu thì mọi request có req.ip = ::1 và
      # rate limit gộp mọi người dùng.
      - key: TRUST_PROXY
        value: render
      # Chỉ bật tạm (true) để xác minh chuỗi proxy — ghi IP người dùng vào log.
      - key: LOG_FORWARDED_IPS
        sync: false

  - type: web
    name: the-practice
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @writing-helper/web build
    staticPublishPath: apps/web/dist
    # Biến build-time. Bỏ trống VITE_SENTRY_DSN → không có dòng Sentry nào trong
    # bundle. Có SENTRY_AUTH_TOKEN → upload source map rồi xoá .map khỏi dist.
    envVars:
      - key: VITE_SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
    # Vite gắn hash nội dung vào tên file trong /assets, nên cache vĩnh viễn an toàn;
    # index.html giữ mặc định (max-age=0) để bản deploy mới tới ngay.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Chống nhúng iframe (clickjacking) và rò rỉ URL — áp dụng ngay.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Micro chỉ cho chính site (bài nói); camera, vị trí thì không ai dùng.
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      # CSP ở chế độ Report-Only: chỉ báo vi phạm ra console, chưa chặn. Khi đã xác
      # minh trên production (đăng nhập Google, Sentry, bài nói) thì đổi tên header
      # thành Content-Security-Policy. Hash là script chọn theme inline trong
      # apps/web/index.html — csp.test.ts báo lỗi nếu hai bên lệch nhau.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' 'sha256-ibdAdOnCLKuLK3e/HMwCPxYEE6iSrYxmWYcCA3lNbeI=' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/ https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://accounts.google.com/gsi/; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://the-practice-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
