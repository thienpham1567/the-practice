<!doctype html>
<meta charset="utf-8" />
<title>Speaking probe — recorder</title>
<style>
  :root { --paper:#faf6ef; --ink:#1f1c18; --soft:#6b6255; --verm:#c14324; --rule:#e4dccd; }
  body { background:var(--paper); color:var(--ink); font:16px/1.6 Georgia,serif;
         max-width:44rem; margin:0 auto; padding:3rem 1.5rem; }
  h1 { font-size:1.6rem; margin:0 0 .25rem; }
  p.lede { color:var(--soft); margin:0 0 2rem; }
  button { font:600 .75rem/1 ui-monospace,monospace; letter-spacing:.15em;
           text-transform:uppercase; padding:.9rem 1.4rem; border:0; cursor:pointer;
           background:var(--ink); color:var(--paper); }
  button.stop { background:var(--verm); }
  button:disabled { opacity:.35; cursor:default; }
  #time { font:700 3rem/1 Georgia,serif; margin:1.5rem 0 .5rem; }
  #meter { display:flex; gap:3px; height:22px; align-items:flex-end; margin-bottom:1.5rem; }
  #meter i { width:6px; background:var(--rule); display:block; }
  #meter i.on { background:var(--verm); }
  #status { color:var(--soft); font-size:.9rem; min-height:1.6em; }
  #status.err { color:var(--verm); }
  hr { border:0; border-top:1px solid var(--rule); margin:2rem 0; }
  ol { color:var(--soft); font-size:.95rem; } code { font-size:.85em; }
</style>

<h1>Speaking probe — recorder</h1>
<p class="lede">Thu 16 kHz mono WAV, đúng định dạng app gửi lên OpenRouter.</p>

<div id="time">0:00</div>
<div id="meter"></div>

<button id="go">Start recording</button>
<button id="halt" class="stop" disabled>Stop &amp; download</button>

<p id="status"></p>

<hr />
<ol>
  <li>Mở <code>probe-speaking-script.md</code> và đọc đoạn trong đó, làm đúng các chỗ ghi chú.</li>
  <li>Bấm Stop — file <code>probe.wav</code> tự tải về.</li>
  <li>Chạy <code>node apps/api/scripts/probe-speaking-quality.mjs ~/Downloads/probe.wav</code></li>
</ol>

<script type="module">
  const TARGET_RATE = 16000;
  const $ = (id) => document.getElementById(id);
  const meter = $('meter');
  for (let i = 0; i < 28; i++) meter.appendChild(document.createElement('i'));
  const bars = [...meter.children];

  let ctx, node, source, stream, chunks = [], startedAt = 0, timer = null, recording = false;

  // Cùng thuật toán encodeWav của app: mono → downsample 16 kHz → header 44 byte.
  function encodeWav(pcm, sourceRate) {
    const ratio = sourceRate / TARGET_RATE;
    const outLen = Math.floor(pcm.length / ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) out[i] = pcm[Math.floor(i * ratio)] ?? 0;

    const bytes = outLen * 2;
    const buf = new ArrayBuffer(44 + bytes);
    const v = new DataView(buf);
    const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); v.setUint32(4, 36 + bytes, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, TARGET_RATE, true);
    v.setUint32(28, TARGET_RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, bytes, true);
    let o = 44;
    for (let i = 0; i < outLen; i++) {
      const s = Math.max(-1, Math.min(1, out[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      o += 2;
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  const say = (msg, isErr = false) => { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; };

  $('go').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch (e) {
      say(`Mic bị từ chối (${e.name}). Cho phép micro cho trang này rồi thử lại.`, true);
      return;
    }
    ctx = new AudioContext();
    source = ctx.createMediaStreamSource(stream);
    node = ctx.createScriptProcessor(4096, 1, 1);
    chunks = []; recording = true; startedAt = Date.now();

    node.onaudioprocess = (e) => {
      if (!recording) return;
      const input = e.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(input));
      let peak = 0;
      for (let i = 0; i < input.length; i++) peak = Math.max(peak, Math.abs(input[i]));
      const lit = Math.round(peak * 3 * bars.length);
      bars.forEach((b, i) => b.classList.toggle('on', i < lit));
      bars.forEach((b, i) => { b.style.height = `${4 + (i < lit ? 18 : 0)}px`; });
    };
    source.connect(node); node.connect(ctx.destination);

    timer = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $('time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }, 200);

    $('go').disabled = true; $('halt').disabled = false;
    say('Đang thu — đọc đoạn trong probe-speaking-script.md.');
  };

  $('halt').onclick = () => {
    recording = false;
    clearInterval(timer);
    node?.disconnect(); source?.disconnect();
    stream?.getTracks().forEach((t) => t.stop());

    const total = chunks.reduce((n, c) => n + c.length, 0);
    const pcm = new Float32Array(total);
    let at = 0;
    for (const c of chunks) { pcm.set(c, at); at += c.length; }

    let sum = 0;
    for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
    const rms = Math.sqrt(sum / (pcm.length || 1));

    const blob = encodeWav(pcm, ctx.sampleRate);
    const secs = (total / ctx.sampleRate).toFixed(1);
    void ctx.close();

    if (rms < 0.005) {
      say(`Gần như im lặng (RMS ${rms.toFixed(4)}) — mic có thể chưa bắt được tiếng. Thu lại.`, true);
    } else {
      const a = Object.assign(document.createElement('a'),
        { href: URL.createObjectURL(blob), download: 'probe.wav' });
      a.click();
      say(`Đã tải probe.wav — ${secs}s, ${(blob.size / 1024).toFixed(0)} KB, RMS ${rms.toFixed(3)}.`);
    }
    $('go').disabled = false; $('halt').disabled = true;
  };
</script>
