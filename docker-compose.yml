services:
  postgres:
    image: postgres:16-alpine
    container_name: writing-helper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: writing_helper
      POSTGRES_PASSWORD: writing_helper
      POSTGRES_DB: writing_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writing_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
